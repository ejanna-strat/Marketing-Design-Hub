<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Marketing Design Hub: light bulb + fountain pen. Browser-tab icon (no background). -->
<g stroke="#1e1b4b" stroke-linejoin="round" stroke-linecap="round">
  <!-- spark -->
  <g stroke="#fde68a" stroke-width="2.4" fill="none">
    <path d="M9 13 L13 16"/><path d="M12 7 L14.5 12"/><path d="M5 19.5 L10.5 20"/>
  </g>
  <!-- bulb glass -->
  <path d="M27 9 C37.5 9 44 17 44 25.5 C44 31 41 34.5 38.5 37.5 C37 39.3 36.5 40.8 36.5 43 L21.5 43 C21.5 40.8 21 39.3 19.5 37.5 C17 34.5 14 31 14 25.5 C14 17 18.5 9 27 9 Z" fill="#ffffff" stroke-width="2.6"/>
  <path d="M19.5 22 C20.5 17.5 23.5 14.5 27.5 13.8" fill="none" stroke="#c7d2fe" stroke-width="2.4"/>
  <!-- filament -->
  <path d="M25 43 L25 34 C25 30 21.5 29.5 21.5 32 C21.5 34.5 26 33.5 29 31 C31 29.3 32.5 29 34 30" fill="none" stroke-width="2"/>
  <!-- base -->
  <rect x="21" y="43" width="16" height="4.6" rx="2" fill="#c7d2fe" stroke-width="2.4"/>
  <rect x="22" y="47.6" width="14" height="4.4" rx="2" fill="#a5b4fc" stroke-width="2.4"/>
  <path d="M25 52 L33 52 L31 55.5 L27 55.5 Z" fill="#818cf8" stroke-width="2.2"/>
  <!-- pen, drawn upright then tilted -->
  <g transform="rotate(32 41 33)">
    <rect x="36" y="2" width="10" height="34" rx="5" fill="#bfdbfe" stroke-width="2.6"/>
    <path d="M39 6 L39 30" stroke="#ffffff" stroke-width="2" fill="none"/>
    <rect x="35.5" y="32" width="11" height="4" rx="1.2" fill="#2dd4bf" stroke-width="2.2"/>
    <path d="M36 36 L46 36 L44.5 44 L41 53 L37.5 44 Z" fill="#fcd34d" stroke-width="2.4"/>
    <path d="M41 45.5 L41 52" stroke-width="1.6"/>
    <circle cx="41" cy="44" r="1.3" fill="#1e1b4b" stroke="none"/>
  </g>
</g>
</svg>
