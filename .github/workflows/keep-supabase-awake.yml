# Free Supabase projects pause after 7 days without activity (owner, Oct 26).
# Every 2 days this reads one row from staging and production so they stay
# awake. Uses the public (anon) keys, stored as GitHub secrets.
name: Keep Supabase awake

on:
  schedule:
    - cron: "0 1 */2 * *" # 9AM Manila, every other day
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [STAGING, PROD]
    steps:
      - name: Read one row from ${{ matrix.project }}
        env:
          URL: ${{ secrets[format('SUPABASE_{0}_URL', matrix.project)] }}
          KEY: ${{ secrets[format('SUPABASE_{0}_ANON_KEY', matrix.project)] }}
        # Anonymous visitors can't read any table (RLS + no grants), so the
        # database answers "permission denied" (42501). That answer still
        # comes from the database, which is the activity Supabase counts.
        run: |
          body=$(curl -s -w "\nHTTP %{http_code}" "$URL/rest/v1/teams?select=id&limit=1" -H "apikey: $KEY")
          echo "$body" | tail -1
          echo "$body" | grep -qE '"code":"42501"|^HTTP 200$'
